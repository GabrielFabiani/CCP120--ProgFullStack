<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/aula04.css">
    <title>Adivinhação</title>
</head>
<body>
    <div class="digite">
        <div class="Num">
            <label for="input" class="text">Número:</label>
            <input type="text" id="input" placeholder="Digite um número" class="input">
            <button onclick="verificar()">Adivinhar</button>
        </div>
        <div id="resultado"></div>
    </div>

    <div class="voltar">
        <p><a class="link-projetos" href="../projects.html">Projetos</a></p>
    </div>

    <script>
        const numeroAleatorio = Math.floor(Math.random() * 10);
        console.log("Número sorteado:", numeroAleatorio);

        function verificar() {
            const valor = document.getElementById("input").value;
            const resultado = document.getElementById("resultado");

            if (valor === "") {
                alert("Digite um número!");
                return;
            }

            const numeroUsuario = parseInt(valor);

            if (numeroUsuario === numeroAleatorio) {
                resultado.textContent = "Parabéns! Você acertou!";
                document.body.style.backgroundColor = "lightgreen";
            } else if (numeroUsuario > numeroAleatorio) {
                resultado.textContent = "Tente um número menor!";
                document.body.style.backgroundColor = "lightcoral";
            } else {
                resultado.textContent = "Tente um número maior!";
                document.body.style.backgroundColor = "lightyellow";
            }
        }
    </script>
</body>
</html>
